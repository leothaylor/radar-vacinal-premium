name: Release hotfix

on:
  push:
    branches:
      - fix/release-2026-09-15

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply release hotfix with exact assertions
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(
              'index.html',
              'const APP_VERSION = "2.0.0";',
              'const APP_VERSION = "2.1.1";'
          )
          replace_exact(
              'index.html',
              'const GA4_MEASUREMENT_ID = ""; // Defina \'G-XXXXXXXXXX\' para ativar o GA4. Vazio = analytics desligado (app funciona normalmente).',
              'const GA4_MEASUREMENT_ID = "G-1R4X13FDVY"; // Propriedade dedicada do Radar Vacinal ACS.'
          )
          replace_exact(
              'index.html',
              "if(window.RadarAnalytics) RadarAnalytics.track('patient_added', { profile: newChild.profileType });",
              "if(window.RadarAnalytics) RadarAnalytics.track('patient_added');"
          )

          replace_exact(
              'js/engine.js',
              ": (rule.maxMonths != null ? addMonths(birth, rule.maxMonths) : null);",
              ": (rule.maxMonths != null ? addMonths(birth, rule.maxMonths + 1) : null);"
          )
          replace_exact(
              'js/engine.js',
              "var close = rule.maxMonths != null ? addMonths(child.birthDate, rule.maxMonths) : null;",
              "var close = rule.maxMonths != null ? addMonths(child.birthDate, rule.maxMonths + 1) : null;"
          )
          replace_exact(
              'js/engine.js',
              "if (close && getDaysDiff(close, today) < 0) { out.status = 'window_closed'; out.tDateStr = 'Janela encerrada'; return out; }",
              "if (close && getDaysDiff(close, today) <= 0) { out.status = 'window_closed'; out.tDateStr = 'Janela encerrada'; return out; }"
          )
          replace_exact(
              'js/engine.js',
              "if (closeDiff < 0) { out.status = 'window_closed'; out.tDateStr = 'Janela encerrada'; return out; }",
              "if (closeDiff <= 0) { out.status = 'window_closed'; out.tDateStr = 'Janela encerrada'; return out; }"
          )

          replace_exact(
              'service-worker.js',
              "const CACHE_VERSION = 'radar-acs-v2.1.0-2026.09.10';",
              "const CACHE_VERSION = 'radar-acs-v2.1.1-2026.09.15';"
          )

          tests = Path('tests/engine.test.js')
          text = tests.read_text(encoding='utf-8')
          marker = "test('migração preserva datas de IDs sem equivalente em legacyAppliedDates', () => {"
          if marker not in text:
              raise SystemExit('tests/engine.test.js: insertion marker not found')
          block = r'''

test('HPV permanece elegível até o dia anterior ao 15º aniversário e fecha aos 15 anos', () => {
  const birth = '2011-09-15';
  const before15 = engine.analisarCalendario({ birthDate: birth, applied: [] }, calendar, new Date(2026, 8, 14, 12)).doses.find(d => d.id === 'hpv_dose');
  const at15 = engine.analisarCalendario({ birthDate: birth, applied: [] }, calendar, new Date(2026, 8, 15, 12)).doses.find(d => d.id === 'hpv_dose');
  assert.strictEqual(before15.status, 'eligible');
  assert.strictEqual(at15.status, 'window_closed');
});

test('Dengue D1 permanece elegível até o dia anterior ao 15º aniversário e fecha aos 15 anos', () => {
  const birth = '2011-09-15';
  const before15 = engine.analisarCalendario({ birthDate: birth, applied: [] }, calendar, new Date(2026, 8, 14, 12)).doses.find(d => d.id === 'dengue_1');
  const at15 = engine.analisarCalendario({ birthDate: birth, applied: [] }, calendar, new Date(2026, 8, 15, 12)).doses.find(d => d.id === 'dengue_1');
  assert.strictEqual(before15.status, 'eligible');
  assert.strictEqual(at15.status, 'window_closed');
});

test('MenACWY permanece elegível até o dia anterior ao 15º aniversário e fecha aos 15 anos', () => {
  const birth = '2011-09-15';
  const before15 = engine.analisarCalendario({ birthDate: birth, applied: [] }, calendar, new Date(2026, 8, 14, 12)).doses.find(d => d.id === 'menacwy_ado');
  const at15 = engine.analisarCalendario({ birthDate: birth, applied: [] }, calendar, new Date(2026, 8, 15, 12)).doses.find(d => d.id === 'menacwy_ado');
  assert.strictEqual(before15.status, 'eligible');
  assert.strictEqual(at15.status, 'window_closed');
});

test('Dengue D2 não fecha prematuramente antes do 15º aniversário', () => {
  const birth = '2011-09-15';
  const child = { birthDate: birth, applied: ['dengue_1'], appliedDates: { dengue_1: '2026-05-01' } };
  const before15 = engine.analisarCalendario(child, calendar, new Date(2026, 8, 14, 12)).doses.find(d => d.id === 'dengue_2');
  const at15 = engine.analisarCalendario(child, calendar, new Date(2026, 8, 15, 12)).doses.find(d => d.id === 'dengue_2');
  assert.strictEqual(before15.status, 'eligible');
  assert.strictEqual(at15.status, 'window_closed');
});
'''
          if "HPV permanece elegível até o dia anterior ao 15º aniversário" in text:
              raise SystemExit('boundary tests already present')
          tests.write_text(text.replace(marker, block + "\n" + marker, 1), encoding='utf-8')

          changelog = Path('docs/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          header = '# Changelog — Radar Vacinal ACS\n'
          if not text.startswith(header):
              raise SystemExit('CHANGELOG header mismatch')
          entry = '''# Changelog — Radar Vacinal ACS\n\n## v2.1.1 — 2026-09-15\n\n- Corrigida a fronteira superior das janelas etárias para manter elegibilidade durante todo o último mês permitido e encerrar no aniversário seguinte.\n- Adicionados testes de regressão para HPV, Dengue D1/D2 e MenACWY na fronteira dos 15 anos.\n- Ativado o GA4 próprio do Radar (`G-1R4X13FDVY`) e removido o parâmetro `profile` do evento `patient_added`.\n- Sincronizados `APP_VERSION` e `CACHE_VERSION` para a release 2.1.1.\n'''
          changelog.write_text(entry + text[len(header):], encoding='utf-8')

      - name: Run engine tests
        run: node --test tests/engine.test.js

      - name: Verify release invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const GA4_MEASUREMENT_ID = "G-1R4X13FDVY"' index.html
          grep -F "RadarAnalytics.track('patient_added');" index.html
          if grep -F "RadarAnalytics.track('patient_added', { profile:" index.html; then
            echo 'Unsafe profile parameter still present' >&2
            exit 1
          fi
          grep -F 'const APP_VERSION = "2.1.1"' index.html
          grep -F "const CACHE_VERSION = 'radar-acs-v2.1.1-2026.09.15';" service-worker.js

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/engine.js tests/engine.test.js service-worker.js docs/CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: finalize Radar release 2.1.1'
          git push
